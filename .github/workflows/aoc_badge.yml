name: AoC badge

on:
  schedule:
    # 05:05 UTC = 00:05 US Eastern in December, just after AoC unlocks
    - cron: '5 5 1-25 12 *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Override the day (1-25) to test'
        required: false

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build badge JSON
        env:
          DAY_OVERRIDE: ${{ inputs.day }}
        run: |
          GIFTS=("" "🍐" "🕊️" "🐔" "🐦‍⬛" "💍" "🪿" "🦢" "🐄" "💃" "🤴" "🪈" "🥁")
          MONTH=$(TZ=America/New_York date +%-m)
          DAY=${DAY_OVERRIDE:-$(TZ=America/New_York date +%-d)}

          if [ -z "$DAY_OVERRIDE" ] && [ "$MONTH" != "12" ]; then
            MSG="🎄 coming soon"
          elif [ "$DAY" -le 12 ]; then
            MSG="${GIFTS[$DAY]} Day $DAY"
          else
            MSG="🎁 Day $DAY"
          fi

          mkdir -p badge
          B64=$(base64 -w0 badge/logo.png)
          LOGO="<svg xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" viewBox=\"0 0 100 100\" width=\"100\" height=\"100\"><image width=\"100\" height=\"100\" xlink:href=\"data:image/png;base64,${B64}\"/></svg>"

          jq -n --arg msg "$MSG" --arg logo "$LOGO" '{
            schemaVersion: 1,
            label: "AoC 2026",
            message: $msg,
            labelColor: "c8282d",
            color: "1f7a45",
            logoSvg: $logo
          }' > badge/aoc.json
          cat badge/aoc.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badge/aoc.json
          git diff --cached --quiet || (git commit -m "Update AoC badge" && git push)